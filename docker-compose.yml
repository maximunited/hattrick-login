services:
  keepalive:
    build: .
    env_file:
      - path: .env
        required: true
    environment:
      HATTRICK_SESSION_DIR: /data/session
      HATTRICK_CHROME_BINARY: /usr/bin/google-chrome-stable
      HOME: /tmp/chrome-home
      TMPDIR: /tmp
      PYTHONUNBUFFERED: "1"
    volumes:
      - type: bind
        source: ${HATTRICK_SESSION_DIR:-/home/maxim/.hattrick-session}
        target: /data/session
    shm_size: "2gb"
